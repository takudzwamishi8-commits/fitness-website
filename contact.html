<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | Elite Fitness</title>

<meta name="description" content="Contact Elite Fitness.">

<meta name="keywords" content="gym,fitness,contact,personal training">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<h1>Contact Us</h1>

<form id="contactForm" action="mailto:takudzwamishi8@gmail.com" method="post" enctype="text/plain">

<label>Name</label>

<input type="text" id="name" required minlength="3">

<label>Email</label>

<input type="email" id="email" required>

<label>Phone</label>

<input type="tel" id="phone" required pattern="[0-9]{10}">

<label>Message</label>

<textarea id="message" minlength="10" required></textarea>

<button type="submit">Send Message</button>

</form>

<script src="js/script.js"></script>

</body>

</html>
