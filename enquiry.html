<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enquiry | Elite Fitness</title>

<meta name="description" content="Enquire about memberships and personal training.">

<meta name="keywords" content="gym,fitness,membership,enquiry">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<h1>Membership Enquiry</h1>

<form id="enquiryForm">

<label>Full Name</label>
<input type="text" required>

<label>Email</label>
<input type="email" required>

<label>Select Membership</label>

<select id="service" required>

<option value="">Choose One</option>

<option>Student Membership</option>

<option>Standard Membership</option>

<option>Premium Membership</option>

<option>Personal Training</option>

</select>

<label>Message</label>

<textarea rows="5" required></textarea>

<button type="submit">Submit Enquiry</button>

</form>

<script src="js/script.js"></script>

</body>

</html>
